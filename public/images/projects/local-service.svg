<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="servBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141009" />
      <stop offset="100%" stop-color="#241a0d" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#servBg)" />

  <rect x="70" y="40" width="660" height="420" rx="16" fill="#18130b" fill-opacity="0.8" stroke="#3d2c17" stroke-width="1.5" />
  <circle cx="100" cy="70" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="120" cy="70" r="6" fill="#fbbf24" opacity="0.8"/>
  <circle cx="140" cy="70" r="6" fill="#fde68a" opacity="0.8"/>
  <text x="170" y="75" fill="#fde68a" font-family="monospace" font-size="13" font-weight="600">SMART_SERVICE_HUB // VERIFIED_PROVIDER_DISPATCH</text>

  <!-- Network of service nodes -->
  <g transform="translate(400, 250)">
    <!-- Central Hub -->
    <circle cx="0" cy="0" r="45" fill="#291b07" stroke="#f59e0b" stroke-width="2"/>
    <text x="-25" y="6" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="14">CORE</text>

    <!-- Outlying Service Nodes -->
    <line x1="0" y1="0" x2="-180" y2="-70" stroke="#78480d" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="-180" cy="-70" r="32" fill="#1f1508" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="-205" y="-65" fill="#fef3c7" font-family="sans-serif" font-size="11">Electrical</text>

    <line x1="0" y1="0" x2="180" y2="-70" stroke="#78480d" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="180" cy="-70" r="32" fill="#1f1508" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="156" y="-65" fill="#fef3c7" font-family="sans-serif" font-size="11">Plumbing</text>

    <line x1="0" y1="0" x2="-140" y2="100" stroke="#78480d" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="-140" cy="100" r="32" fill="#1f1508" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="-165" y="105" fill="#fef3c7" font-family="sans-serif" font-size="11">Appliance</text>

    <line x1="0" y1="0" x2="140" y2="100" stroke="#78480d" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="140" cy="100" r="32" fill="#1f1508" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="105" fill="#fef3c7" font-family="sans-serif" font-size="11">Repairs</text>
  </g>

  <!-- Status pill -->
  <rect x="290" y="400" width="220" height="34" rx="17" fill="#2d1c08" stroke="#f59e0b" stroke-width="1"/>
  <text x="320" y="422" fill="#fef3c7" font-family="monospace" font-size="11">STATUS: IN_DEVELOPMENT</text>
</svg>
