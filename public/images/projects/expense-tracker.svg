<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#05120e" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#162620" stroke-width="1" stroke-dasharray="4,4">
    <line x1="100" y1="100" x2="700" y2="100" />
    <line x1="100" y1="180" x2="700" y2="180" />
    <line x1="100" y1="260" x2="700" y2="260" />
    <line x1="100" y1="340" x2="700" y2="340" />
    <line x1="100" y1="420" x2="700" y2="420" />
  </g>

  <!-- Frame & Header -->
  <rect x="70" y="40" width="660" height="420" rx="16" fill="#0d141b" fill-opacity="0.7" stroke="#1e2c28" stroke-width="1.5" />
  <circle cx="100" cy="70" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="120" cy="70" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="140" cy="70" r="6" fill="#10b981" opacity="0.8"/>
  <text x="170" y="75" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="600">EXPENSE_SHA // ML_REGRESSION_ENGINE.PY</text>

  <!-- Bar columns -->
  <rect x="130" y="280" width="36" height="130" rx="4" fill="url(#barGrad)" />
  <rect x="190" y="240" width="36" height="170" rx="4" fill="url(#barGrad)" />
  <rect x="250" y="200" width="36" height="210" rx="4" fill="url(#barGrad)" />
  <rect x="310" y="260" width="36" height="150" rx="4" fill="url(#barGrad)" />
  <rect x="370" y="160" width="36" height="250" rx="4" fill="url(#barGrad)" />
  <rect x="430" y="190" width="36" height="220" rx="4" fill="url(#barGrad)" />
  <rect x="490" y="130" width="36" height="280" rx="4" fill="url(#barGrad)" />
  <rect x="550" y="150" width="36" height="260" rx="4" fill="url(#barGrad)" />
  <rect x="610" y="110" width="36" height="300" rx="4" fill="url(#barGrad)" />

  <!-- Predictive Regression Trendline -->
  <path d="M 148 290 Q 268 220 388 170 T 628 115" fill="none" stroke="url(#lineGrad)" stroke-width="4" filter="url(#glow)" />
  <path d="M 628 115 L 680 90" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- Regression Node points -->
  <circle cx="148" cy="290" r="5" fill="#10b981" stroke="#042416" stroke-width="2" />
  <circle cx="268" cy="210" r="5" fill="#10b981" stroke="#042416" stroke-width="2" />
  <circle cx="388" cy="170" r="5" fill="#10b981" stroke="#042416" stroke-width="2" />
  <circle cx="508" cy="140" r="5" fill="#10b981" stroke="#042416" stroke-width="2" />
  <circle cx="628" cy="115" r="7" fill="#34d399" stroke="#042416" stroke-width="3" />

  <!-- Telemetry Badge -->
  <rect x="480" y="65" width="220" height="42" rx="8" fill="#042416" stroke="#10b981" stroke-width="1"/>
  <text x="500" y="90" fill="#a7f3d0" font-family="monospace" font-size="12">Prediction: R² = 0.942 | In-Bounds</text>
</svg>

