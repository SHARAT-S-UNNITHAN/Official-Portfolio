    <circle cx="55" cy="-45" r="5" fill="#10b981" />
    <circle cx="-60" cy="30" r="5" fill="#10b981" />
    <circle cx="20" cy="65" r="5" fill="#10b981" />
    <circle cx="-35" cy="-55" r="5" fill="#10b981" />
    <circle cx="100" cy="40" r="5" fill="#ef4444" />
    <line x1="0" y1="0" x2="55" y2="-45" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
    <line x1="0" y1="0" x2="-60" y2="30" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
  </g>

