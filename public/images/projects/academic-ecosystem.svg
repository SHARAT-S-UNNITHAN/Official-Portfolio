  <rect x="520" y="340" width="180" height="85" rx="10" fill="#0f1f38" stroke="#1d3557" stroke-width="1"/>
  <text x="540" y="370" fill="#93c5fd" font-family="sans-serif" font-size="12">Attendance Integrity</text>
