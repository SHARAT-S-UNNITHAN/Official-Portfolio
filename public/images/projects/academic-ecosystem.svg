  <g transform="translate(400, 260)">
    <circle cx="0" cy="0" r="170" fill="none" stroke="#1e3a6a" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
    <circle cx="0" cy="0" r="125" fill="#1e3a8a" fill-opacity="0.1" stroke="#2563eb" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="80" fill="#3b82f6" fill-opacity="0.15" stroke="#60a5fa" stroke-width="2"/>
