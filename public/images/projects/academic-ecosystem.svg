  <rect width="800" height="500" fill="url(#acadBg)" />

  <!-- Frame -->
  <rect x="70" y="40" width="660" height="420" rx="16" fill="#0c1524" fill-opacity="0.8" stroke="#1d2e4a" stroke-width="1.5" />
  <circle cx="100" cy="70" r="6" fill="#3b82f6" opacity="0.8"/>
  <circle cx="120" cy="70" r="6" fill="#60a5fa" opacity="0.8"/>
  <circle cx="140" cy="70" r="6" fill="#93c5fd" opacity="0.8"/>
