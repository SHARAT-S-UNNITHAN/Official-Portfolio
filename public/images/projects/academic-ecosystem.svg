      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#081427" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
